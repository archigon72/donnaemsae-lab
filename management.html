<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0c1521"><title>관리 · 돈냄새연구소</title><link rel="stylesheet" href="management.css"><link rel="stylesheet" href="asset-hub.css"><script src="product-shell.js"></script><link rel="icon" href="favicon.ico" type="image/x-icon"><link rel="stylesheet" href="portal-navigation.css"><link rel="stylesheet" href="asset-finish.css"><script defer src="portal-navigation.js"></script><style>.ticker-results{list-style:none;margin:0;padding:0;border:1px solid #ccc;max-height:200px;overflow:auto;background:#fff;color:#000}.ticker-results li{padding:8px;cursor:pointer}.ticker-results li:hover{background:#f0f0f0}.ref-price{margin:4px 0;color:#888}</style><style>.quick-ratio{display:flex;gap:4px;margin:4px 0}.quick-ratio button{flex:1;padding:6px 2px;font-size:0.85em}</style><style>@media(max-width:400px){.trade-fields{grid-template-columns:64px 1fr 96px !important}.trade-fields button{font-size:0.72em !important;padding:0 4px !important}}</style><style>
/* The ledger's shared input rule must NOT paint the entire 44px range control. */
.garden #ledger-dialog input[type="range"]{
  display:block;width:100%;height:44px;min-height:44px;
  margin:5px 0 0;padding:0 !important;
  border:0 !important;border-radius:0 !important;
  background:transparent !important;box-shadow:none !important;
  appearance:none;-webkit-appearance:none;
  --fill:0%;accent-color:#4a9eff;
}
.garden #ledger-dialog input[type="range"]::-webkit-slider-runnable-track{
  height:8px;border:0;border-radius:999px;
  background:linear-gradient(to right,#4a9eff 0%,#4a9eff var(--fill),#2b3440 var(--fill),#2b3440 100%);
}
.garden #ledger-dialog input[type="range"]::-webkit-slider-thumb{
  appearance:none;-webkit-appearance:none;
  width:20px;height:20px;margin-top:-6px;
  border:0;border-radius:50%;background:#4a9eff;cursor:pointer;
}
.garden #ledger-dialog input[type="range"]::-moz-range-track{
  height:8px;border:0;border-radius:999px;
  background:linear-gradient(to right,#4a9eff 0%,#4a9eff var(--fill),#2b3440 var(--fill),#2b3440 100%);
}
.garden #ledger-dialog input[type="range"]::-moz-range-thumb{
  width:20px;height:20px;border:0;border-radius:50%;background:#4a9eff;cursor:pointer;
}
</style></head><body data-portal-service="management" class="garden" data-view="management"><div id="app"></div><script src="management-ledger.js"></script><script src="management-storage.js"></script><script src="management-data.js"></script><script src="management-view.js"></script></body></html>
